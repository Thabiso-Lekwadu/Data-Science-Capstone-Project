# Existing display-name parameters (kept — used elsewhere for reporting labels)
name_ct: "Crime Only - Tree"
name_ck: "Crime Only - KNN"
name_mt: "Master Enriched - Tree"
name_mk: "Master Enriched - KNN"

# --- Feature engineering: time-series lag/rolling window sizes ---
# Expressed in units of the underlying series frequency (the API sources are
# pulled at annual frequency — see catalog.yml `freq: "A"` — so lag_periods: [1, 2, 3]
# means 1, 2, and 3 years back). Adjust if your ingestion frequency changes.
lag_periods: [1, 2, 3]
rolling_windows: [3, 5]

# --- Model training: walk-forward (expanding-window) CV ---
# Number of validation folds. Fold boundaries are computed once from
# master_dataset_features's date range (see compute_fold_boundaries) and
# reused for crime_dataset_features, so both conditions are evaluated on
# identical validation windows and their per-fold RMSEs are paired.
# NOTE: with annual data you need at least n_splits + 1 distinct years of
# history after the lag warm-up rows are dropped — if this errors with
# "not enough distinct periods", lower n_splits.
n_splits: 2